<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      /* apply a saved theme before first paint to avoid a flash */
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <title>Greenmiles – Explore Kerala, the green way</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Greenmiles plans your Kerala holiday the green way: Munnar tea hills, Alleppey backwaters, Varkala cliffs, Wayanad forests and more." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />

    <!-- icons: generated from the brand PDF by scripts/build-brand.mjs -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="mask-icon" href="brand/safari-pinned-tab.svg" color="#008BD2" />
    <link rel="manifest" href="site.webmanifest" />

    <!-- social previews (use an absolute og:image URL once the production domain is known) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Greenmiles" />
    <meta property="og:title" content="Greenmiles – Explore Kerala, the green way" />
    <meta property="og:description" content="Beaches, backwaters, hill stations and forests. Plan your Kerala journey with Greenmiles." />
    <meta property="og:image" content="og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>

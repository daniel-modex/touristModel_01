@if (!done()) {
  <div #root class="loader" role="status" aria-live="polite">
    <span class="sr-only">Loading Greenmiles</span>

    <div class="sheet" aria-hidden="true">
      <!-- slow, blurred pools of colour: the "liquid" the glass floats on -->
      <div class="orbs">
        <i class="orb o1"></i>
        <i class="orb o2"></i>
        <i class="orb o3"></i>
        <i class="orb o4"></i>
      </div>
      <div class="noise"></div>

      <!-- Liquid Glass capsule holding the logo -->
      <div class="capsule">
        <div class="logo-wrap">
          <!-- dim copy underneath -->
          <div class="logo-mask">
            <div class="logo-layer logo-back"><app-logo [mono]="true" [height]="76" /></div>
          </div>
          <!-- bright copy: its clip-path sweeps open as loading progresses -->
          <div class="logo-mask front-mask">
            <div class="logo-layer logo-front"><app-logo [mono]="true" [height]="76" /></div>
          </div>
        </div>
      </div>
    </div>
  </div>
}

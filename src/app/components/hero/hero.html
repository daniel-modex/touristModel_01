<section class="hero" id="top">
  <div class="media">
    <video
      #heroVideo
      class="video"
      src="video/kerala-hero.mp4"
      aria-hidden="true"
      tabindex="-1"
      muted
      [muted]="true"
      playsinline
      disablepictureinpicture
      disableremoteplayback
      preload="auto"
      (timeupdate)="onTimeUpdate(heroVideo)"
      (ended)="onEnded()"
      (canplay)="tryPlay()"
    >
    </video>
  </div>

  <div class="copy" [class.text-in]="textReady()">
    <h1>Extraordinary natural and<br />cultural charm</h1>
    <p>Exploring Kerala is an unforgettable adventure.</p>

    <form class="search glass glass--clear" [class.text-in]="textReady()" (ngSubmit)="search()" #f="ngForm" role="search" aria-label="Find a Kerala trip">
      <label class="field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
        <input type="date" name="date" [(ngModel)]="date" aria-label="Date" />
      </label>
      <label class="field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 11h18"/></svg>
        <select name="budget" [(ngModel)]="budget" aria-label="Budget">
          <option value="" disabled>Budget</option>
          @for (b of budgets; track b) { <option [value]="b">{{ b }}</option> }
        </select>
      </label>
      <label class="field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        <select name="guests" [(ngModel)]="guests" aria-label="Guests">
          <option value="" disabled>Guests</option>
          @for (g of guestOptions; track g) { <option [value]="g">{{ g }}</option> }
        </select>
      </label>
      <button type="submit" class="go">Search Trips</button>
    </form>
  </div>
</section>

<section class="stats container">
  @for (s of stats; track s.label; let i = $index) {
    <div class="stat" [appReveal]="i * 120">
      <strong
        [appCountUp]="s.value"
        [decimals]="s.decimals ?? 0"
        [pad]="s.pad ?? 0"
        [suffix]="s.suffix"
      >{{ s.display ?? s.value + s.suffix }}</strong>
      <span>{{ s.label }}</span>
    </div>
  }
</section>

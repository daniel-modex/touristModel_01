<section class="container t" appReveal>
  <div class="who">
    <div class="who-top">
      <span class="avatar">{{ initials() }}</span>
      <span>
        <strong>{{ current().name }}</strong>
        <small>{{ current().role }}</small>
      </span>
    </div>
    <div class="arrows">
      <button type="button" aria-label="Previous review" (click)="step(-1)"><span aria-hidden="true">←</span></button>
      <span aria-hidden="true">{{ index() + 1 }} / {{ total }}</span>
      <button type="button" aria-label="Next review" (click)="step(1)"><span aria-hidden="true">→</span></button>
    </div>
  </div>

  <blockquote aria-live="polite">
    <span class="quote" aria-hidden="true">”</span>
    @for (t of [current()]; track t.name) {
      <p class="text" appSplit>{{ t.quote }}</p>
    }
  </blockquote>
</section>

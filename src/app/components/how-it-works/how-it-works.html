<section class="container how" id="how" (mouseenter)="pause()" (mouseleave)="resume()" (focusin)="pause()" (focusout)="resume()">
  <div class="visual" appReveal>
    <img src="images/explorer.jpg" alt="A traveller resting on a rock in a forest pool beneath a waterfall" width="695" height="820" loading="lazy" />
    <div class="shade"></div>
    <div class="dock">
      <form class="search" (ngSubmit)="search()" role="search" aria-label="Find a Kerala trip">
        <label class="field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
          <input type="date" name="date" [(ngModel)]="date" aria-label="Date" />
        </label>
        <label class="field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 11h18"/></svg>
          <select name="budget" [(ngModel)]="budget" aria-label="Budget">
            <option value="" disabled>Budget</option>
            @for (b of budgets; track b) { <option [value]="b">{{ b }}</option> }
          </select>
        </label>
        <label class="field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <select name="guests" [(ngModel)]="guests" aria-label="Guests">
            <option value="" disabled>Guests</option>
            @for (g of guestOptions; track g) { <option [value]="g">{{ g }}</option> }
          </select>
        </label>
        <button type="submit" class="go">Search Trips</button>
      </form>
      <a class="cta" href="#packages">Plan Your Trip <span aria-hidden="true">→</span></a>
      <p>Embark on a journey to find your dream destination, where adventure and relaxation await, creating unforgettable memories along the way</p>
    </div>
  </div>

  <div class="steps">
    <div appReveal="100">
      <span class="eyebrow">How it works</span>
      <h2 class="section-title" appSplit>One click for you</h2>
    </div>

    <ul>
      @for (s of steps; track s.title; let i = $index) {
        <li [appReveal]="200 + i * 120">
          <button type="button" class="step" [class.active]="active() === i" [attr.aria-pressed]="active() === i" (click)="select(i)">
            <span class="ico">
              @switch (s.icon) {
                @case ('search') { <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4-4"/></svg> }
                @case ('ticket') { <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8a2 2 0 0 0 0 4v4h16v-4a2 2 0 0 1 0-4V6H4z"/><path d="M9 6v12" stroke-dasharray="2 2"/></svg> }
                @case ('payment') { <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3 5 13h6l-1 8 8-10h-6z"/></svg> }
                @case ('compass') { <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 4.5 3.4 7.7 8 9 4.6-1.3 8-4.5 8-9V6z"/></svg> }
              }
            </span>
            <span class="txt">
              <strong>{{ s.title }}</strong>
              <small>{{ s.text }}</small>
            </span>
          </button>
        </li>
      }
    </ul>
  </div>
</section>

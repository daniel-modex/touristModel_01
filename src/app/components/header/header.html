<header class="bar" [class.over-content]="overContent()">
  <a class="brand" href="#top" (click)="go('top', $event)" aria-label="Greenmiles home">
    <!-- one-colour white over the hero video, full colour over page content -->
    <app-logo [mono]="!overContent()" [height]="40" />
  </a>

  <nav id="site-nav" class="links glass" [class.glass--clear]="!overContent()" [class.open]="menuOpen()" aria-label="Primary">
    @for (l of links; track l.id) {
      <a [href]="'#' + l.id" [attr.aria-current]="active() === l.id ? 'true' : null" (click)="go(l.id, $event)">{{ l.label }}</a>
    }
  </nav>

  <div class="right">
    <div class="lang glass" [class.glass--clear]="!overContent()" role="group" aria-label="Language">
      <button type="button" [attr.aria-pressed]="lang() === 'ML'" (click)="setLang('ML')" lang="ml">മല</button>
      <button type="button" [attr.aria-pressed]="lang() === 'EN'" (click)="setLang('EN')">EN</button>
    </div>
    <a class="login" href="#" (click)="$event.preventDefault()">Log In</a>
    <button
      type="button"
      class="burger glass"
      [class.glass--clear]="!overContent()"
      aria-label="Menu"
      aria-controls="site-nav"
      [attr.aria-expanded]="menuOpen()"
      (click)="menuOpen.set(!menuOpen())"
    >
      <span></span><span></span>
    </button>
  </div>
</header>

<span #ruler class="ruler" aria-hidden="true">{{ shown() }}</span>
<button
  type="button"
  class="trigger"
  role="combobox"
  aria-haspopup="listbox"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="uid + '-list'"
  [attr.aria-label]="label() + (value() ? ': ' + value() : '')"
  [attr.aria-activedescendant]="open() ? uid + '-' + cursor() : null"
  [class.placeholder]="!value()"
  (click)="toggle()"
  (keydown)="onKey($event)"
>
  <span class="text">{{ shown() }}</span>
  <svg class="chev" [class.flip]="open()" viewBox="0 0 12 12" aria-hidden="true"><path d="m2.5 4.5 3.5 3.5 3.5-3.5" /></svg>
</button>

@if (open()) {
  <ul class="menu" [class.up]="up()" [class.end]="end()" role="listbox" [id]="uid + '-list'" [attr.aria-label]="label()">
    @for (o of options(); track o; let i = $index) {
      <li
        role="option"
        [id]="uid + '-' + i"
        [class.sel]="o === value()"
        [class.cur]="i === cursor()"
        [attr.aria-selected]="o === value()"
        (pointermove)="cursor.set(i)"
        (pointerdown)="$event.preventDefault()"
        (click)="choose(i)"
      >
        <svg class="tick" viewBox="0 0 16 16" aria-hidden="true"><path d="m3 8.5 3.2 3.2L13 4.8" /></svg>
        <span>{{ o }}</span>
      </li>
    }
  </ul>
}
